<script type="module" src="../assets/js/page-entry.js" data-page="library"></script>
<section class="page-intro library-intro">
    <div>
        <span class="eyebrow">Biblioteca</span>
        <h2>Encuentra una capacidad por objetivo, dominio o tipo.</h2>
        <p>Todos los resultados apuntan al Markdown canónico del repositorio.</p>
    </div>
    <span class="catalog-version" id="catalog-version">schema v3</span>
</section>

<div class="library-discovery">
    <div class="library-controls glass-card">
        <label class="library-search">
            <span class="sr-only">Buscar activos</span>
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="library-search" type="search" placeholder="Buscar por título, objetivo, dominio o tag..." autocomplete="off">
        </label>
        <select id="library-domain-filter" aria-label="Filtrar por dominio"></select>
        <select id="library-difficulty-filter" aria-label="Filtrar por nivel"></select>
        <select id="library-status-filter" aria-label="Filtrar por estado"></select>
        <select id="library-compatibility-filter" aria-label="Filtrar por compatibilidad"></select>
        <select id="library-model-filter" aria-label="Filtrar por agente o modelo"></select>
        <select id="library-sort" aria-label="Ordenar activos">
            <option value="title">Orden: título</option>
            <option value="updated">Orden: actualización</option>
            <option value="difficulty">Orden: nivel</option>
            <option value="type">Orden: tipo</option>
        </select>
    </div>

    <div class="type-filters" id="library-type-filters" aria-label="Filtrar por tipo"></div>
    <div class="active-tag-filter" id="library-active-tag" hidden>
        Tag: <strong></strong>
        <button type="button" data-tag-filter="" aria-label="Quitar filtro por tag"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<div class="library-meta">
    <span id="library-result-count">Cargando activos...</span>
    <button class="text-link" id="library-clear-filters">Limpiar filtros</button>
</div>

<div id="asset-grid" class="asset-grid" aria-live="polite"></div>

<section id="asset-viewer" class="asset-viewer" hidden tabindex="-1" aria-labelledby="asset-viewer-title">
    <div class="asset-viewer-toolbar">
        <button class="icon-btn" id="asset-viewer-close" aria-label="Cerrar recurso"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
            <span id="asset-viewer-breadcrumb">Biblioteca</span>
            <h3 id="asset-viewer-title">Recurso</h3>
            <p id="asset-viewer-summary"></p>
        </div>
        <div class="file-actions">
            <button class="btn btn-secondary" id="asset-reading-mode" type="button" aria-pressed="false">
                <i class="fa-solid fa-book-open" aria-hidden="true"></i> <span>Modo lectura</span>
            </button>
            <button class="btn btn-secondary" id="copy-asset-content" data-copy-target="asset-viewer-content" data-copy-message="Activo copiado">
                <i class="fa-regular fa-copy"></i> Copiar
            </button>
            <button class="btn btn-secondary" id="download-asset-content" data-download-target="asset-viewer-content">
                <i class="fa-solid fa-download"></i> Descargar
            </button>
            <a class="btn btn-secondary" id="open-asset-source" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Fuente
            </a>
            <button class="btn btn-secondary" id="retry-asset-content" type="button" hidden>
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Reintentar
            </button>
        </div>
    </div>
    <div class="asset-viewer-layout">
        <aside id="asset-viewer-meta" class="asset-meta"></aside>
        <article class="asset-source markdown-body" id="asset-viewer-content">Cargando...</article>
    </div>
    <section id="asset-related" class="asset-related" hidden></section>
</section>
