<script type="module" src="../assets/js/page-entry.js" data-page="models"></script>
<div class="glass-card model-selector-card">
    <h3>Uso por Agente</h3>
    <p class="subtitle">Selecciona una plataforma para ver recomendaciones de uso sin romper la universalidad del prompt.</p>
    
    <div class="tabs-control">
        <button class="tab-btn active" data-model="claude">
            <i class="fa-solid fa-brain"></i> Anthropic Claude
        </button>
        <button class="tab-btn" data-model="gemini">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Google Gemini
        </button>
        <button class="tab-btn" data-model="copilot">
            <i class="fa-solid fa-rocket"></i> GitHub Copilot
        </button>
    </div>

    <div class="model-content-area">
        <div class="model-desc" id="model-intro-text">
            Recomendaciones para usar el prompt maestro con Claude.
        </div>
        <div class="code-preview-box">
            <div class="code-header">
                <span id="model-file-path">CLAUDE.md</span>
                <div class="file-actions">
                    <button class="btn btn-sm btn-secondary copy-model-content" data-copy-target="model-code-display" data-copy-message="Plantilla copiada">
                        <i class="fa-solid fa-copy"></i> Copiar
                    </button>
                    <button class="btn btn-sm btn-secondary" data-download-target="model-code-display" data-download-name="CLAUDE.md">
                        <i class="fa-solid fa-download"></i> Descargar
                    </button>
                </div>
            </div>
            <article class="markdown-body" id="model-code-display">Cargando plantilla...</article>
        </div>
    </div>
</div>
